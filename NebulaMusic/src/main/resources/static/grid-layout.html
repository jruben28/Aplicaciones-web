        .parent{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 100px);
            gap: 5px;
            max-width: 500px;
            border: 1px solid black;
            padding: 5px;
            background-color: #f0f0f0;
        }

        .parent div{
            border: 1px solid black;
            background-color: #ffe4b5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .div1{
            /*fila inicio, columna inicio, fila fin, columna fin*/
            grid-area: 1/1/3/2;
        }

        .div2{
            grid-area: 1/2/3/4;
        }

        .div3{
            grid-area: 1/4/2/5;
        }

        .div4{
            grid-area: 2/4/3/5;
        }

        .div5{
            grid-area: 3/1/5/3;
        }

        .div6{
            grid-area: 4/3/5/5;
        }

        .div7{
            grid-area: 3/3/4/5;
        }
    </style>
