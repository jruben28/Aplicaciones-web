<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>
                   Crear cuenta
                </h1>
                <div>
                    <label for="nombre">
                        Nombre:
                    </label>
                    <input id="nombre"
                           type="text"
                           name="nombre"
                           placeholder="ej. Ruben Valdez"
                           minlength="3"
                           maxlength="80"
                           required
                    >
                </div>
                <div>
                    <label for="correo">
                        Correo
                    </label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="juanito.manoslargas@mail.com"
                            required
                            maxlength="100"
                            minlength="5"
                    >
                </div>
                <div>
                    <label for="contrasena">
                        Constraseña
                    </label>
                    <input
                            id="contrasena"
                            type="password"
                            name="contrasena"
                            placeholder="minimo 8 caracteres"
                            minlength="8"
                            maxlength="20"
                            required
                    >
                </div>
                <div>
                    <label for="pseudonimo">
                        Pseudonimo
                    </label>
                    <input
                            type="text"
                            id="pseudonimo"
                            name="pseudonimo"
                            required
                            pattern="[a-zA-Z]{3, 10}-[0-9]{2,10}"
                            placeholder="Nebula-2025"
                            minlength="6"
                            maxlength="20"
                    >
                </div>
                <div>
                    <label>
                        Genero
                    </label>
                    <input
                            type="radio"
                            id="rad_fem"
                            name="genero"
                            value="femenino"
                            required
                    >
                    <label for="rad_fem">Femenino</label>
                    <input
                            type="radio"
                            id="rad_masc"
                            name="genero"
                            value="masculino"
                            required
                    >
                    <label for="rad_masc">Masculino</label>
                    <input
                            type="radio"
                            id="rad_otro"
                            name="genero"
                            value="otro"
                            required
                    >
                    <label for="rad_otro">Otro</label>

                </div>
                <div>
                    <label for="suscripcion">
                        Tipo de suscripción:
                    </label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option>
                            ----- Selecciona una opción -----
                        </option>
                        <option value="gratis">Gratis (Con anuncios)</option>
                        <option value="premium_mensual">Premium mensual ($99/mes)</option>
                        <option value="premium_anual">Premium anual($999/año)</option>
                    </select>
                </div>
                <div>
                    <label for="fechaNacimiento">
                        Fecha de nacimiento:
                    </label>
                    <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required
                    >
                </div>
                <div>
                    <input
                            type="checkbox"
                            id="terminos"
                            value="aceptado"
                            required
                    >
                    <label for="terminos">
                        Acepto los terminos y condiciones de uso.
                    </label>
                </div>
                <div>
                    <label for="comentarios">
                        Comentarios o gustos:
                    </label>
                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        cols="40"
                        placeholder="Cuentanos que musica te gusta"

                    >

                    </textarea>
                </div>
                <div>
                    <button type="submit">
                        Crear cuenta
                    </button>
                    <button type="reset">
                        Limpiar formulario
                    </button>
                </div>
                <p>
                    ¿Ya tienes cuenta?
                </p>
                <a href="iniciar-sesion.html.html">
                    Inicia sesion aquí.
                </a>
            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
